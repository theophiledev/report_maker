name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Prepare Capacitor project
        working-directory: android-app
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          npm install
          npm run prepare:www
          if [ -n "$SERVER_URL" ]; then echo "window.BV_API=\"$SERVER_URL\";" > www/config.js; fi
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bisate-reports-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
